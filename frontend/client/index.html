<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Конструктор презентации</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="client.css?v=6">
</head>
<body>
<div id="app">
  <header class="head">
    <div class="head-title" id="title">Загружаем КП…</div>
    <div class="head-price" id="price"></div>
  </header>

  <nav class="tabs" id="tabs" hidden></nav>

  <!-- Выбор дизайна: живые обложки, листаются пальцем -->
  <section class="designs" id="designs" hidden>
    <div class="designs-head">
      <span class="designs-label">Дизайн</span>
      <span class="designs-name" id="designName"></span>
    </div>
    <div class="designs-track" id="designTrack"></div>
  </section>

  <p class="hint" id="hint">Нажмите на любое фото в макете — снизу появятся снимки для замены.</p>

  <section class="stage" id="stage">
    <div class="frame-wrap" id="frameWrap"><iframe id="frame" title="Превью" scrolling="no"></iframe></div>
    <div class="loading" id="loading">Собираем превью…</div>
  </section>

  <div class="error" id="error" hidden></div>
</div>

<!-- Панель замены фото: выезжает снизу, как только выбрана рамка в макете -->
<div class="sheet" id="sheet" aria-hidden="true">
  <div class="sheet-head">
    <span class="slot-name" id="slotName">Фото</span>
    <button class="done" id="doneBtn" type="button">Готово</button>
  </div>
  <div class="strip-wrap" id="stripWrap">
    <div class="strip" id="strip"></div>
    <button class="nav prev" id="prevBtn" type="button" aria-label="Назад"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="nav next" id="nextBtn" type="button" aria-label="Вперёд"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="sheet-tools">
    <label class="zoom">
      <span>Масштаб</span>
      <input type="range" id="zoom" min="1" max="3" step="0.02" value="1">
    </label>
    <button class="ghost" id="resetBtn" type="button">Сбросить</button>
  </div>
  <p class="sheet-hint">Двигайте фото пальцем прямо в макете, чтобы выровнять кадр</p>
</div>

<button class="save" id="saveBtn" type="button" disabled>Сохранить и получить файлы</button>
<script src="client.js?v=6"></script>
</body>
</html>
