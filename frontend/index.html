<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Montaro — расчёт и КП</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23c8912f'/%3E%3Cpath d='M8 23V9h3.6l4.4 8 4.4-8H24v14h-3.2v-8.4L16.9 21h-1.8l-3.9-6.4V23z' fill='%23151a20'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css?v=2">
<!-- defer: без него разбор страницы встаёт на этом скрипте, и если
     telegram.org у клиента недоступен, экран остаётся пустым.
     Порядок сохраняется: defer и модули выполняются по порядку в документе -->
<script defer src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<!-- Тосты (свои, вместо alert) -->
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>

<!-- Шапка: бренд + кто вошёл + курс дня -->
<header id="topbar" class="topbar" hidden>
  <span class="brand">
    <span class="brand-mark" aria-hidden="true">M</span>
    <span class="brand-text">
      <span class="brand-name">MONTARO</span>
      <span class="brand-sub">Авто из Европы</span>
    </span>
  </span>
  <span id="topbar-info" class="topbar-info"></span>
</header>

<!-- Сюда монтируются экраны. Заглушка нужна до выполнения скриптов:
     если модули не загрузятся, пользователь увидит причину, а не пустой экран -->
<main id="app" class="app">
  <div class="state" id="boot-note">
    <span class="spinner"></span>
    <div class="state-title">Загружаем приложение…</div>
  </div>
</main>
<noscript>
  <div class="state">В этом клиенте отключены скрипты — откройте приложение в Telegram.</div>
</noscript>

<script>
// Сторож загрузки: модульные скрипты могут не выполниться (сеть оборвалась,
// старый клиент, блокировка). Тогда экран остаётся пустым, и понять причину
// нельзя ни пользователю, ни нам. Через 12 секунд показываем, что случилось.
(function () {
  var problem = '';
  window.addEventListener('error', function (e) {
    if (!problem) {
      problem = (e && (e.message || (e.error && e.error.message)))
        || (e && e.target && e.target.src ? 'не загрузился файл ' + e.target.src : '');
    }
  }, true);

  setTimeout(function () {
    if (window.__appBooted) return;
    var note = document.getElementById('boot-note');
    if (!note) return;
    var tg = (window.Telegram && window.Telegram.WebApp) || {};
    var about = ['Telegram ' + (tg.version || '?'), tg.platform || '?'].join(' · ');
    note.innerHTML =
      '<div class="state-title">Приложение не загрузилось</div>' +
      '<div class="state-text">' + (problem || 'скрипты не выполнились — похоже, оборвалась связь') + '</div>' +
      '<div class="state-text">' + about + '</div>' +
      '<button class="btn mt8" type="button" onclick="location.reload()">Попробовать снова</button>';
  }, 12000);
})();
</script>

<!-- Своя главная кнопка: используется, только если нет Telegram.WebApp.MainButton -->
<div id="mainbtn-wrap" class="mainbtn-wrap" hidden>
  <button id="mainbtn" class="mainbtn" type="button"></button>
</div>

<!-- Нижняя навигация -->
<nav id="tabbar" class="tabbar" hidden>
  <button class="tab" type="button" data-tab="calc">
    <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M8 7h8M8 11h3M13 11h3M8 15h3M13 15h3"/>
    </svg>
    <span class="tab-label">Расчёт</span>
  </button>
  <button class="tab" type="button" data-tab="history">
    <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v4h4"/><path d="M12 8v4.5l3 1.8"/>
    </svg>
    <span class="tab-label">История</span>
  </button>
  <button class="tab" type="button" data-tab="settings" hidden>
    <svg class="tab-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/>
    </svg>
    <span class="tab-label">Настройки</span>
  </button>
</nav>

<script type="module" src="app.js?v=2"></script>
</body>
</html>
