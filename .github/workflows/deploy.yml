name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # позволяет перезапустить деплой руками из вкладки Actions

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: push

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /opt/autokpbot
            git pull origin main

            # ── Записываем .env из GitHub Secrets ───────────────────────────
            cat > .env <<EOF
            OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
            AI_MODEL=${{ secrets.AI_MODEL }}
            TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}
            ADMIN_TELEGRAM_ID=${{ secrets.ADMIN_TELEGRAM_ID }}
            GOOGLE_SHEET_ID=${{ secrets.GOOGLE_SHEET_ID }}
            GOOGLE_SHEET_TAB=${{ secrets.GOOGLE_SHEET_TAB }}
            GOOGLE_CREDENTIALS=credentials.json
            WEB_APP_URL=${{ secrets.WEB_APP_URL }}
            CLIENT_BOT_TOKEN=${{ secrets.CLIENT_BOT_TOKEN }}
            EOF

            # ── Записываем credentials.json из base64-secret ───────────────
            echo "${{ secrets.GOOGLE_CREDENTIALS_B64 }}" | base64 -d > backend/credentials.json

            # ── Обновляем зависимости ───────────────────────────────────────
            /opt/autokpbot/venv/bin/pip install -r backend/requirements.txt -q

            # ── Перезапускаем бота и мини-апп ──────────────────────────────
            systemctl restart autokpbot
            systemctl restart autokpweb || echo "⚠️ autokpweb не установлен — см. DEPLOY.md"

            # ── Клиентский бот (презентации для контрагентов) ──────────────
            # Юнит копируем при каждом деплое: правки в deploy/ доезжают сами
            CLIENT_ENABLED=0
            if grep -q '^CLIENT_BOT_TOKEN=.\+' .env; then
              CLIENT_ENABLED=1
              cp deploy/autokpclient.service /etc/systemd/system/autokpclient.service
              systemctl daemon-reload
              systemctl enable --quiet autokpclient
              systemctl restart autokpclient
              CLIENT_RESTARTS=$(systemctl show -p NRestarts --value autokpclient)
            else
              echo "ℹ️ CLIENT_BOT_TOKEN не задан — клиентский бот пропущен"
            fi

            # Презентации собирает Chrome — без него бот работает, но файлы не соберутся
            command -v google-chrome >/dev/null || echo "⚠️ google-chrome не найден — презентации не соберутся"

            # ── Проверяем, что всё поднялось ───────────────────────────────
            # 8 секунд: упавший при старте сервис systemd успевает перезапустить,
            # и мгновенная проверка показала бы «active» у неработающего бота
            sleep 8
            echo "Статус сервисов:"
            systemctl is-active autokpbot
            systemctl is-active autokpweb || true
            [ "$CLIENT_ENABLED" = 1 ] && systemctl is-active autokpclient || true

            if systemctl is-enabled autokpweb >/dev/null 2>&1; then
              echo "Проверка мини-аппа:"
              curl -fsS -m 15 http://127.0.0.1:8000/health || {
                echo "❌ мини-апп не отвечает на /health"
                journalctl -u autokpweb -n 30 --no-pager
                exit 1
              }
              echo
              curl -fsS -m 15 -o /dev/null http://127.0.0.1:8000/api/client/font || {
                echo "❌ API конструктора презентаций не отвечает"
                journalctl -u autokpweb -n 30 --no-pager
                exit 1
              }
            fi

            if [ "$CLIENT_ENABLED" = 1 ]; then
              if ! systemctl is-active --quiet autokpclient \
                 || [ "$(systemctl show -p NRestarts --value autokpclient)" != "$CLIENT_RESTARTS" ]; then
                echo "❌ клиентский бот не запустился"
                journalctl -u autokpclient -n 40 --no-pager
                exit 1
              fi
            fi

            # Бот не должен падать сразу после старта
            if ! systemctl is-active --quiet autokpbot; then
              echo "❌ бот не запустился"
              journalctl -u autokpbot -n 30 --no-pager
              exit 1
            fi

            echo "✅ Деплой завершён"
