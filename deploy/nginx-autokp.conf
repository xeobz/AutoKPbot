# Конфиг nginx для мини-аппа. Кладётся в /etc/nginx/sites-available/autokp
# и линкуется в /etc/nginx/sites-enabled/.
#
# HTTPS-часть допишет certbot: sudo certbot --nginx -d montaro.site -d www.montaro.site
#
# После certbot добавить в блок 443:
#     http2 on;
# и в /etc/nginx/nginx.conf, рядом с «gzip on»:
#     gzip_vary on;
#     gzip_proxied any;      # без этого ответы бэкенда не жмутся
#     gzip_min_length 512;
#     gzip_comp_level 5;
#     gzip_types text/plain text/css application/json application/javascript
#                text/javascript application/xml image/svg+xml;
# Мини-апп весит 102 КБ без сжатия и 33 КБ с ним — на слабой связи это
# разница между «открылось» и «бесконечная загрузка».

server {
    listen 80;
    listen [::]:80;
    server_name montaro.site www.montaro.site;

    # Телеграм не открывает мини-апп по http — после certbot тут появится редирект на https
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Разбор объявления идёт через браузер и занимает до минуты
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
